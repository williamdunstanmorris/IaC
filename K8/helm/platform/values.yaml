argo-cd:
  configs:
    params:
      server.insecure: true
      controller.log.format: "text"
  server:
    ingress:
      enabled: true
      controller: gke
      hostname: "argocd.subcloudlabs.com"
      tls: false
      annotations:
        kubernetes.io/ingress.class: "gce"
        kubernetes.io/ingress.global-static-ip-name: "gke-ingress-ip"
        networking.gke.io/pre-shared-cert: "gke-managed-cert"
